

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Kalorien Tracker PRO</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body {

  margin:0;

  font-family: -apple-system, BlinkMacSystemFont;

  background:#0B0B0F;

  color:white;

}


.container { padding:16px; }


.card {

  background:#1A1A22;

  padding:16px;

  border-radius:16px;

  margin-bottom:16px;

}


h2 { margin-bottom:10px; }


input, button {

  width:100%;

  padding:12px;

  margin-top:8px;

  border-radius:10px;

  border:none;

}


input { background:#2A2A33; color:white; }


button {

  background:#FF7A00;

  color:white;

  font-weight:bold;

}


.tabs {

  display:flex;

}


.tabs button {

  flex:1;

  background:#222;

}


.active {

  background:#FF7A00 !important;

}


.big {

  font-size:28px;

  font-weight:bold;

}


.progress {

  height:10px;

  background:#333;

  border-radius:10px;

  margin-top:10px;

}


.bar {

  height:10px;

  background:#FF7A00;

  border-radius:10px;

}


.entry {

  background:#222;

  padding:10px;

  border-radius:10px;

  margin-top:8px;

}

</style>

</head>


<body>


<div class="container">


<h2>🔥 Tracker PRO</h2>


<div class="tabs">

<button id="tabBtn1" class="active" onclick="showTab(1)">Tracking</button>

<button id="tabBtn2" onclick="showTab(2)">Analyse</button>

</div>


<!-- TAB 1 -->

<div id="tab1">


<div class="card" id="setup">

<input id="start" placeholder="Startgewicht">

<input id="goal" placeholder="Zielgewicht">

<input id="target" placeholder="Soll Defizit / Tag (-350)">

<button onclick="saveSetup()">Speichern</button>

</div>


<div class="card">

<input id="cal" placeholder="Kalorien heute">

<input id="weight" placeholder="Gewicht (optional)">

<button onclick="add()">Speichern / Aktualisieren</button>

</div>


<div class="card">

<div class="big" id="goalText"></div>

<div id="status"></div>


<div class="progress">

<div id="bar" class="bar"></div>

</div>


<div id="forecast"></div>

</div>


<div class="card">

<div id="history"></div>

</div>


</div>


<!-- TAB 2 -->

<div id="tab2" style="display:none;">

<div class="card">

<canvas id="chart"></canvas>

</div>


<div class="card">

<div id="compare"></div>

<div id="milestones"></div>

</div>

</div>


</div>


<script>

let entries = JSON.parse(localStorage.getItem("entries")||"[]");

let config = JSON.parse(localStorage.getItem("config")||"null");


// Tabs

function showTab(n){

 tab1.style.display = n===1?"block":"none";

 tab2.style.display = n===2?"block":"none";


 tabBtn1.classList.toggle("active",n===1);

 tabBtn2.classList.toggle("active",n===2);

}


// Setup

function saveSetup(){

 config = {

  start: parseFloat(start.value),

  goal: parseFloat(goal.value),

  target: parseInt(target.value)

 };

 localStorage.setItem("config",JSON.stringify(config));

 setup.style.display="none";

 update();

}


if(config) setup.style.display="none";


// Add / Update

function add(){

 let today=new Date().toDateString();


 let index=entries.findIndex(e =>

  new Date(e.date).toDateString()===today

 );


 let calVal=parseInt(cal.value);

 let w=parseFloat(weight.value);


 if(isNaN(calVal)) return alert("Zahl eingeben");


 if(index !== -1){

  entries[index].cal = calVal;

  entries[index].weight = w || null;

 } else {

  entries.push({

   cal: calVal,

   weight: w || null,

   date: new Date().toISOString()

  });

 }


 localStorage.setItem("entries",JSON.stringify(entries));

 cal.value=""; weight.value="";

 update();

}


// Edit

function editEntry(i){

 let c = prompt("Kalorien:", entries[i].cal);

 if(c===null) return;


 let w = prompt("Gewicht:", entries[i].weight||"");


 entries[i].cal=parseInt(c);

 entries[i].weight=w?parseFloat(w):null;


 localStorage.setItem("entries",JSON.stringify(entries));

 update();

}


// Delete

function deleteEntry(i){

 if(confirm("Löschen?")){

  entries.splice(i,1);

  localStorage.setItem("entries",JSON.stringify(entries));

  update();

 }

}


// Update

function update(){

 if(!config) return;


 let total=0, ist=[], soll=[], weights=[], labels=[];

 let sum=0;


 entries.forEach((e,i)=>{

  total+=e.cal;

  sum+=e.cal;

  ist.push(sum);

  soll.push((i+1)*config.target);

  weights.push(e.weight);

  labels.push("T"+(i+1));

 });


 let goalKcal=(config.start-config.goal)*7000;

 let percent=Math.min(100,(Math.abs(total)/goalKcal)*100);


 goalText.innerText =

  total.toLocaleString()+" / -"+goalKcal.toLocaleString()+" kcal";


 bar.style.width = percent+"%";


 let expected=entries.length*config.target;

 let diff=total-expected;


 status.innerText =

  diff<0?"🔥 Voraus":"⚠️ Hinterher";


 let avg = entries.length ? total/entries.length : 0;


 if(avg!==0){

  let remain=(goalKcal-Math.abs(total));

  let daysLeft=remain/Math.abs(avg);


  forecast.innerText =

   "⏱ ca. "+Math.abs(daysLeft.toFixed(0))+" Tage";

 }


 renderHistory();

 drawChart(labels,ist,soll,weights);

 buildMilestones(avg,goalKcal);

}


// History

function renderHistory(){

 let html="<h3>Einträge</h3>";


 entries.forEach((e,i)=>{

  html += `

  <div class="entry">

  ${new Date(e.date).toLocaleDateString()}<br>

  ${e.cal} kcal | ${e.weight||"-"} kg<br>

  <button onclick="editEntry(${i})">✏️</button>

  <button onclick="deleteEntry(${i})">🗑️</button>

  </div>`;

 });


 history.innerHTML=html;

}


// Chart

let chart;

function drawChart(labels,ist,soll,weights){

 if(chart) chart.destroy();


 chart = new Chart(document.getElementById("chart"), {

  type:"line",

  data:{

   labels,

   datasets:[

    {label:"IST kcal",data:ist},

    {label:"SOLL kcal",data:soll},

    {label:"Gewicht",data:weights, yAxisID:"y1"}

   ]

  },

  options:{

   scales:{

    y:{beginAtZero:false},

    y1:{

     position:"right",

     grid:{drawOnChartArea:false}

    }

   }

  }

 });

}


// Milestones

function buildMilestones(avg,goalKcal){

 let html="<h3>Meilensteine</h3>";


 [0.25,0.5,0.75,1].forEach(p=>{

  let d = avg ? Math.abs((goalKcal*p)/avg).toFixed(0) : "?";

  html += `<div>${p*100}% → ${d} Tage</div>`;

 });


 milestones.innerHTML=html;

}


update();

</script>


</body>

</html>
