<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>Tracker PRO MAX</title>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



<style>

body {

  margin:0;

  font-family:-apple-system, BlinkMacSystemFont;

  background: linear-gradient(180deg,#0B0B0F,#111);

  color:white;

}



.container {

  padding:16px;

}



h2 {

  font-size:22px;

  margin-bottom:12px;

}



.card {

  background: rgba(255,255,255,0.05);

  backdrop-filter: blur(10px);

  border-radius:20px;

  padding:16px;

  margin-bottom:16px;

}



input,button {

  width:100%;

  padding:14px;

  margin-top:8px;

  border:none;

  border-radius:12px;

  font-size:16px;

}



input {

  background:rgba(255,255,255,0.08);

  color:white;

}



button {

  background: linear-gradient(90deg,#FF7A00,#FF9500);

  color:white;

  font-weight:bold;

}



.big {

  font-size:34px;

  font-weight:bold;

}



.sub {

  opacity:0.7;

  font-size:14px;

}



.progress {

  height:12px;

  background:#333;

  border-radius:12px;

  margin-top:12px;

}



.bar {

  height:12px;

  background:linear-gradient(90deg,#FF7A00,#FF9500);

  border-radius:12px;

}



.calendar {

  display:grid;

  grid-template-columns:repeat(7,1fr);

  gap:6px;

  margin-top:10px;

}



.day {

  padding:10px;

  border-radius:12px;

  text-align:center;

  background:#222;

  font-size:14px;

}



.done {

  background:#2ecc71;

}



.today {

  border:2px solid #FF9500;

}



.entry {

  background:#222;

  padding:12px;

  border-radius:12px;

  margin-top:8px;

}



.tag {

  font-size:12px;

  opacity:0.6;

}



</style>

</head>



<body>



<div class="container">



<h2>🔥 Dein Fortschritt</h2>



<div class="card" id="setup">

<input id="start" placeholder="Startgewicht">

<input id="goal" placeholder="Zielgewicht">

<input id="need" placeholder="Kalorienbedarf (z. B. 2500)">

<button onclick="saveSetup()">Speichern</button>

</div>



<div class="card">

<input id="food" placeholder="🍽 Gegessen heute">

<input id="weight" placeholder="⚖️ Gewicht">

<button onclick="add()">Speichern</button>

</div>



<div class="card">

<div class="big" id="summary"></div>

<div class="sub" id="forecast"></div>



<div class="progress">

<div id="bar" class="bar"></div>

</div>

</div>



<div class="card">

<h3>📅 Kalender</h3>

<div id="calendar" class="calendar"></div>

</div>



<div class="card">

<canvas id="chart"></canvas>

</div>



<div class="card">

<h3>📜 Verlauf</h3>

<div id="history"></div>

</div>



</div>



<script>

let entries = JSON.parse(localStorage.getItem("entries")||"[]");

let config = JSON.parse(localStorage.getItem("config")||"null");



// Setup

function saveSetup(){

 config={

  start:parseFloat(start.value),

  goal:parseFloat(goal.value),

  need:parseInt(need.value)

 };

 localStorage.setItem("config",JSON.stringify(config));

 setup.style.display="none";

 update();

}



if(config) setup.style.display="none";



// Add

function add(){

 let today=new Date().toDateString();



 let idx=entries.findIndex(e =>

  new Date(e.date).toDateString()===today

 );



 let foodVal=parseInt(food.value);

 let w=parseFloat(weight.value);



 if(isNaN(foodVal)) return alert("Kalorien eingeben");



 let deficit=foodVal-config.need;



 if(idx!==-1){

  entries[idx].food=foodVal;

  entries[idx].deficit=deficit;

  entries[idx].weight=w||null;

 } else {

  entries.push({

   food:foodVal,

   deficit:deficit,

   weight:w||null,

   date:new Date().toISOString()

  });

 }



 localStorage.setItem("entries",JSON.stringify(entries));

 food.value=""; weight.value="";

 update();

}



// KI

function kcalPerKg(){

 if(entries.length<10) return 7000;



 let k=0,w=0;



 for(let i=1;i<entries.length;i++){

  if(entries[i].weight && entries[i-1].weight){

   k+=entries[i].deficit;

   w+=entries[i].weight - entries[i-1].weight;

  }

 }



 return w===0?7000:Math.abs(k/w);

}



// Kalender

function buildCalendar(){

 let html="";

 let now=new Date();

 let days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();



 for(let i=1;i<=days;i++){

  let d=new Date(now.getFullYear(),now.getMonth(),i);

  let has=entries.find(e =>

   new Date(e.date).toDateString()===d.toDateString()

  );



  let cls="day";

  if(has) cls+=" done";

  if(d.toDateString()===new Date().toDateString()) cls+=" today";



  html+=`<div class="${cls}" onclick="loadDay('${d.toDateString()}')">${i}</div>`;

 }



 calendar.innerHTML=html;

}



function loadDay(d){

 let e=entries.find(x =>

  new Date(x.date).toDateString()===d

 );



 if(e){

  food.value=e.food;

  weight.value=e.weight||"";

 }

}



// Update

function update(){

 if(!config) return;



 let total=0,data=[],weights=[];



 entries.forEach(e=>{

  total+=e.deficit;

  data.push(total);

  weights.push(e.weight);

 });



 let k=kcalPerKg();

 let kg=total/k;



 summary.innerText =

  total.toLocaleString()+" kcal  •  "+kg.toFixed(2)+" kg";



 let percent=Math.min(100,Math.abs(total)/((config.start-config.goal)*7000)*100);

 bar.style.width=percent+"%";



 let avg=entries.length?total/entries.length:0;

 let goalKcal=(config.start-config.goal)*k;



 if(avg!==0){

  let remain=(goalKcal-Math.abs(total));

  let daysLeft=remain/Math.abs(avg);



  forecast.innerText =

   "⏱ Ziel in ca. "+Math.abs(daysLeft.toFixed(0))+" Tagen";

 }



 drawChart(data,weights);

 buildCalendar();

 renderHistory();

}



// Chart

let chart;

function drawChart(data,weights){

 if(chart) chart.destroy();



 chart=new Chart(document.getElementById("chart"),{

  type:"line",

  data:{

   labels:data.map((_,i)=>i+1),

   datasets:[

    {label:"Defizit",data:data},

    {label:"Gewicht",data:weights,yAxisID:"y1"}

   ]

  },

  options:{

   plugins:{legend:{labels:{color:"white"}}},

   scales:{

    y:{ticks:{color:"white"}},

    y1:{position:"right",ticks:{color:"white"},grid:{drawOnChartArea:false}}

   }

  }

 });

}



// Verlauf

function renderHistory(){

 let html="";



 entries.forEach(e=>{

  html+=`

  <div class="entry">

  <div class="tag">${new Date(e.date).toLocaleDateString()}</div>

  🍽 ${e.food} kcal → 🔥 ${e.deficit} kcal<br>

  ⚖️ ${e.weight||"-"} kg

  </div>`;

 });



 history.innerHTML=html;

}



update();

</script>



</body>

</html>
