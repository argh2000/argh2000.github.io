

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Tracker PRO+</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body {font-family:Arial;background:#0E0E0E;color:white;padding:20px;}

.card {background:#1C1C1E;padding:15px;border-radius:15px;margin-bottom:15px;}

input,button {width:100%;padding:12px;margin-top:10px;}

.big {font-size:34px;font-weight:bold;}

.barWrap{height:10px;background:#333;border-radius:10px;}

.bar{height:10px;background:orange;border-radius:10px;}

</style>

</head>


<body>


<h2>🔥 Tracker PRO+</h2>


<div class="card" id="setup">

<input id="start" placeholder="Startgewicht">

<input id="goal" placeholder="Zielgewicht">

<input id="target" placeholder="Soll Defizit / Tag (-350)">

<button onclick="saveSetup()">Speichern</button>

</div>


<div class="card">

<input id="cal" placeholder="Kalorien">

<input id="weight" placeholder="Gewicht (optional)">

<button onclick="add()">Eintrag speichern</button>

</div>


<div class="card">

<div class="big" id="goalText"></div>

<div id="status"></div>

<div class="barWrap"><div id="bar" class="bar"></div></div>

<div id="forecast"></div>

</div>


<div class="card"><canvas id="chart"></canvas></div>


<script>

let entries = JSON.parse(localStorage.getItem("entries")||"[]");

let config = JSON.parse(localStorage.getItem("config")||"null");


// Setup speichern

function saveSetup(){

 config={

  start:parseFloat(start.value),

  goal:parseFloat(goal.value),

  target:parseInt(target.value)

 };

 localStorage.setItem("config",JSON.stringify(config));

 document.getElementById("setup").style.display="none";

 update();

}


// Setup prüfen

if(config){

 document.getElementById("setup").style.display="none";

}


// Eintrag

function add(){

 let calVal=parseInt(cal.value);

 let w=parseFloat(weight.value);


 if(isNaN(calVal)) return alert("Zahl eingeben");


 entries.push({

  cal:calVal,

  weight:w||null,

  date:new Date().toISOString()

 });


 localStorage.setItem("entries",JSON.stringify(entries));


 cal.value=""; weight.value="";

 update();

}


// Update

function update(){

 if(!config) return;


 let total=0;

 let ist=[], soll=[], weights=[];

 let sum=0;


 entries.forEach((e,i)=>{

  total+=e.cal;

  sum+=e.cal;

  ist.push(sum);

  soll.push((i+1)*config.target);

  weights.push(e.weight);

 });


 let days=entries.length;

 let kcalGoal=(config.start-config.goal)*7000;


 // Fortschritt

 let percent=Math.min(100,(Math.abs(total)/kcalGoal)*100);


 goalText.innerText =

  total.toLocaleString()+" / -"+kcalGoal.toLocaleString()+" kcal";


 bar.style.width=percent+"%";


 // Soll vs Ist

 let expected=days*config.target;

 let diff=total-expected;


 status.innerText =

  diff<0

  ? "🔥 Voraus: "+diff+" kcal"

  : "⚠️ Hinterher: +"+diff+" kcal";


 // Prognose

 let avg=days?total/days:0;

 if(avg!==0){

  let remaining=(kcalGoal-Math.abs(total));

  let daysLeft=remaining/Math.abs(avg);


  forecast.innerText =

   "⏱ Ziel in ca. "+Math.abs(daysLeft.toFixed(0))+" Tagen";

 }


 drawChart(ist,soll,weights);


 reminder();

}


// Chart

let chart;

function drawChart(ist,soll,weights){

 if(chart) chart.destroy();


 chart=new Chart(chartCanvas,{

  type:"line",

  data:{

   labels:ist.map((_,i)=>"Tag "+(i+1)),

   datasets:[

    {label:"IST kcal",data:ist},

    {label:"SOLL kcal",data:soll},

    {label:"Gewicht",data:weights}

   ]

  }

 });

}


// 🔔 Reminder 22 Uhr

function reminder(){

 if(Notification.permission!=="granted"){

  Notification.requestPermission();

 }


 setInterval(()=>{

  let now=new Date();

  let hour=now.getHours();


  let today=new Date().toDateString();


  let hasToday=entries.find(e =>

   new Date(e.date).toDateString()===today

  );


  if(hour===22 && !hasToday){

   new Notification("Kalorien noch eintragen!");

  }

 },60000);

}


update();

</script>


</body>

</html>
